name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: crewaiagent01 # <-- change to your Azure Web App name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Oryx builds the dependencies on Azure (requires the app setting
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true), so we just ship the source.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Invoked as `bash startup.sh` so the file does not need its
          # executable bit set (which Windows checkouts tend to drop).
         
